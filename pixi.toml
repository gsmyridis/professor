[workspace]
authors = ["gsmyridis <georgesmyr@icloud.com>"]
channels = ["https://conda.modular.com/max-nightly", "https://conda.modular.com/max", "conda-forge"]
name = "professor"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[dependencies]
mojo = ">=1.1.0.dev2026081405,<2"

[environments]
dev = ["dev"]
examples = ["examples"]

# ===------------------------------------------------------------------------===
# Main tasks
# ===------------------------------------------------------------------------===

[tasks]
build-package = """
    rattler-build build \
    --recipe conda.recipe/recipe.yaml \
    -c conda-forge \
    -c https://conda.modular.com/max \
"""

format = "pixi run mojo format ."

test-docs = "mojo doc -I src src/professor -o /tmp/professor-doc.json"

test-profile = "mojo run -D PROFESSOR_PROFILE -I src tests/profile/test_profiler.mojo"
test-profile-disabled = "mojo run -I src tests/profile/test_disabled.mojo"
test-quickstart = """
    mojo run -D PROFESSOR_PROFILE -I src examples/quickstart.mojo \
    && mojo run -I src examples/quickstart.mojo
"""

test-report = """
    mojo run -I src tests/report/test_table.mojo \
    && mojo run -I src tests/report/test_csv.mojo \
    && mojo run -D PROFESSOR_PROFILE -I src tests/report/test_report.mojo
"""

test-reptest = "mojo run -I src tests/reptest/test_reptest.mojo"
test-measure = "mojo run -I src tests/measure/test_quantity.mojo"

test-perf = """
    mojo run -I src tests/os/linux/test_config.mojo \
    && mojo run -I src tests/os/linux/test_counts.mojo \
    && mojo run -I src tests/os/linux/test_perf_event_layout.mojo \
"""
test-kperf = """
    mojo run -I src tests/os/apple/test_cpu.mojo \
    && mojo run -I src tests/os/apple/test_database.mojo \
    && mojo run -I src tests/os/apple/test_config.mojo \
    && mojo run -I src tests/os/apple/test_event.mojo \
    && mojo run -I src tests/os/apple/sys/test_kperf_data_layout.mojo
"""
test-backend = """
    {% if pixi.is_linux %}
    pixi run test-perf
    {% elif pixi.is_osx %}
    pixi run test-kperf
    {% else %}
    echo unsupported platform && exit 1
    {% endif %}
"""

test-aarch64 = """mojo run -I src tests/arch/test_aarch64.mojo"""
test-x86 = """mojo run -I src tests/arch/test_x86.mojo"""
test-arch = """
    {% if pixi.platform == "linux-64" or pixi.platform == "osx-64" %}
    pixi run test-x86
    {% elif pixi.platform == "linux-aarch64" or pixi.platform == "osx-arm64" %}
    pixi run test-aarch64
    {% else %}
    echo unsapported architecture && exit 1
    {% endif %}
"""

test = { depends-on = [
  "test-docs",
  "test-profile",
  "test-profile-disabled",
  "test-quickstart",
  "test-report",
  "test-reptest",
  "test-measure",
  "test-backend",
  "test-arch",
] }

# ===------------------------------------------------------------------------===
# Dev
# ===------------------------------------------------------------------------===

[feature.dev.dependencies]
prek = ">=0.4.13,<0.5"

# ===------------------------------------------------------------------------===
# Examples
# ===------------------------------------------------------------------------===

[feature.examples.dependencies]
numpy = ">=2.5.2,<3"
python = ">=3.14.6,<3.15"

[feature.examples.tasks]
haversine-calculate = "python examples/haversine/gendata.py calculate examples/haversine/data/pairs.json"
haversine-generate = "python examples/haversine/gendata.py generate 100000 --output examples/haversine/data/pairs.json"
haversine-profile = """
    mojo run -D PROFESSOR_PROFILE -I src -I examples/haversine/parser examples/haversine/main.mojo examples/haversine/data/pairs.json
"""
haversine-test-parser = """
    mojo run -I src -I examples/haversine/parser examples/haversine/test_parser.mojo
"""

# Hardware counters need elevated privileges: sudo pixi run example-counters
example-counters = "mojo run -D PROFESSOR_PROFILE -I src examples/counters/main.mojo"
example-counters-repetition = "mojo run -I src -I examples/counters examples/counters/repetition.mojo"
