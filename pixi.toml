[workspace]
authors = ["gsmyridis <georgesmyr@icloud.com>"]
channels = [
  "https://conda.modular.com/max-nightly",
  "https://conda.modular.com/max",
  "conda-forge"
]
name = "professor"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
format = "mojo format ."

# Hardware counters need elevated privileges: sudo pixi run example-counters
example-counters = "mojo run -I src examples/counters/main.mojo"
example-counters-repetition = "mojo run -I src -I examples/counters examples/counters/repetition.mojo"

# Tests
test-profile = "mojo run -I src tests/profile/test_profiler.mojo"
test-linux-ffi-layout = "mojo run -I src tests/os/linux/ffi/test_perf_event_layout.mojo"
test-linux-misc = "mojo run -I src tests/os/linux/test_misc.mojo"

test-report = """
    mojo run -I src tests/report/test_table.mojo \
    && mojo run -I src tests/report/test_report.mojo
"""

test-reptest = "mojo run -I src tests/reptest/test_reptest.mojo"

# Test OS
test-apple = """
    mojo run -I src tests/os/apple/test_cpu.mojo \
    && mojo run -I src tests/os/apple/test_database.mojo \
    && mojo run -I src tests/os/apple/test_config.mojo \
    && mojo run -I src tests/os/apple/test_event.mojo \
    && mojo run -I src tests/os/apple/ffi/test_kperf_data_layout.mojo
"""

# Test Arch
test-aarch64 = """mojo run -I src tests/arch/test_aarch64.mojo"""

test = { depends-on = [
  "test-profile",
  "test-report",
  "test-reptest",
  "test-apple",
  "test-aarch64",
] }

[dependencies]
mojo = ">=1.0.0b3.dev2026070806,<2"

[feature.examples.dependencies]
mojo = "==1.0.0b3.dev2026070806"
numpy = ">=2.3.3,<3"
python = ">=3.13,<3.15"

[feature.examples.tasks]
haversine-calculate = "python examples/haversine/gendata.py calculate"
haversine-generate = "python examples/haversine/gendata.py generate 100000 --output examples/haversine/data/pairs.json"
haversine-profile = """
    mojo run -I src -I examples/haversine/parser examples/haversine/main.mojo examples/haversine/data/pairs.json
"""
haversine-test-parser = """
    mojo run -I src -I examples/haversine/parser examples/haversine/test_parser.mojo
"""

[environments]
examples = ["examples"]
